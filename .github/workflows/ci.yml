name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this job only needs to read the repository.
permissions:
  contents: read

# Superseded pushes do not need to finish; keep the queue short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Pinned image: the browser specs need a known Ubuntu baseline, because the
    # Chromium shared libraries and the Bengali fonts are installed per OS release.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # GitHub sets CI=true itself; REQUIRE_BROWSER is what the browser spec
      # reads to refuse a silent skip, so both are stated explicitly here.
      CI: "true"
      REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Strict install: the committed lockfile is the source of truth, so a
      # registry drift or a stale lockfile fails here instead of shipping. The
      # audit below is its own step, so it is not paid for twice here.
      - name: Install dependencies (from the committed lockfile)
        run: npm ci --no-audit --no-fund

      # Security gate: the dependency tree is at zero advisories, and this fails
      # the moment that stops being true, dev-only findings included (the last
      # critical was a dev transitive). It runs before browser provisioning so a
      # regression is reported in seconds, not after minutes of setup.
      - name: Dependency audit
        run: npm run audit

      # Playwright and its Chromium revision are pinned by package-lock.json, so
      # the browser is reproducible; --with-deps installs the system libraries.
      - name: Install Chromium and its shared libraries
        run: npx playwright install --with-deps chromium

      # The UI is Bangla: without a Bengali font Chromium lays the text out with
      # zero glyphs and Playwright reports visible text as hidden. Both packages
      # are in Ubuntu main. No `apt-get update` here: the Playwright step above
      # already refreshed the package lists in this job.
      - name: Install Bengali fonts
        run: sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-lohit-beng-bengali

      # Fail with an actionable message before the suite if the browser cannot
      # load its libraries or no Bengali font is resolvable.
      - name: Verify browser environment
        run: node scripts/verify-browser-env.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs the suite and then the gate: zero skipped tests, the browser spec
      # present and passing, and at least 110 tests passed. A skip fails the job.
      - name: "Tests (strict: a skipped test fails the job)"
        run: npm run test:ci

      - name: Build
        run: npm run build
